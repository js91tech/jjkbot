# Discord bot service — in Railway: duplicate the GitHub service, then set
# Config file path to: railway.bot.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'SERVICE=bot ./scripts/railway-start.sh'"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
