# Use on BOTH Railway services (same config file path: railway.toml).
# Set variable on each service:
#   Web service → SERVICE=web
#   Bot service → SERVICE=bot
#   API service → SERVICE=api  (for 2D Activity client)
# Or name services with "web" / "bot" in the name (auto-detected).

[deploy]
startCommand = "npm run start:railway"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
