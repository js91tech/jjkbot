# Use on bot, web, and api Railway services (same railway.toml).
# Set variable on each service:
#   Web service → SERVICE=web
#   Bot service → SERVICE=bot
#   API service → SERVICE=api  (2D Discord Activity — see docs/RAILWAY-2D-ACTIVITY.md)
# 2D static client: separate repo jjk-game-2d (own railway.toml).
# Or name services with "web" / "bot" in the name (auto-detected).

[deploy]
startCommand = "npm run start:railway"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
