# Use on bot, web, and api Railway services (same railway.toml).
# Set variable on each service:
#   Web service → SERVICE=web
#   Bot service → SERVICE=bot
#   API service → SERVICE=api  (2D — see docs/RAILWAY-2D-ACTIVITY.md)
#   Bot+web one save → SERVICE=botweb  (see docs/RAILWAY-SHARED-DATABASE.md)
# 2D Activity: SERVICE=api + jjk-game-2d repo — docs/RAILWAY-2D-ACTIVITY.md
# Or name services with "web" / "bot" in the name (auto-detected).

[deploy]
startCommand = "npm run start:railway"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
